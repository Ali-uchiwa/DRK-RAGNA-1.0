name:Node.js CI

on:
 push:
   branches:
     -main
 lull_request: 
   branches:
     -main:
   schedule:
     -crone: '0 */6 * * *' #BY ØÞČ

     jobs:
       build:
        runs-on: ubuntu-latest

        strategy:
         matrix:
           node-version: [20.x]

        steps:
         -name: checkout repository 
          uses: actions/checkout@v3

         -name: Set up Node.js
         -uses: actions/setup-node@v3
          with:
             node-version: ${{ matrix.node.node-version }}

         -name: Install dependencies 
          run: sudo apt-get Install -y ffmpeg

         -name: Start application with time out 
          run: |
           timeout 21590s rpm start #limite l'exécution à 5h 59m 50s

            -name: save state (optional)
             run: |
                .save-state.sh
                

    
